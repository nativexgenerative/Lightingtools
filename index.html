<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROCTRL - Show Control</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-panel: #141417;
            --bg-card: #1c1c21;
            --text-main: #ffffff;
            --text-muted: #808089;
            --accent-ma2: #d4af37;
            --accent-reso: #ff007f;
            --accent-wing: #00e5ff;
            --accent-mplay: #00ff40;
            --border-color: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
            -webkit-user-select: none; user-select: none;
        }

        .header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50;
        }

        .status-dot {
            height: 10px; width: 10px; border-radius: 50%; display: inline-block;
            box-shadow: 0 0 8px currentColor;
        }
        .online { background-color: #00ff40; color: #00ff40; }
        .offline { background-color: #ff3333; color: #ff3333; }

        .content-area {
            flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 80px;
        }

        .bottom-nav {
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: space-around;
            padding: 8px 4px 20px 4px; z-index: 50;
        }

        .nav-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            padding: 10px 6px; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .nav-btn.active { color: var(--text-main); background-color: rgba(255,255,255,0.08); }

        .hw-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 6px; padding: 16px 8px;
            font-weight: 700; font-size: 13px; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .hw-btn:active { transform: translateY(2px); background: rgba(255,255,255,0.1); }

        .btn-go { background: linear-gradient(180deg, #1a4025 0%, #0d2614 100%); border-color: #2e7343; color: #85ffaa; }
        .btn-stop { background: linear-gradient(180deg, #401a1a 0%, #260d0d 100%); border-color: #732e2e; color: #ff8585; }

        .fader-container {
            display: flex; flex-direction: column; align-items: center;
            background: var(--bg-panel); padding: 12px 6px; border-radius: 8px;
            border: 1px solid var(--border-color); height: 210px;
        }
        .fader-label { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; }
        .fader-track-wrapper { position: relative; flex: 1; width: 100%; display: flex; justify-content: center; }

        input[type=range] {
            -webkit-appearance: none; width: 140px; height: 36px; background: transparent;
            transform: rotate(-90deg); position: absolute; top: 50%; left: 50%; margin: -18px 0 0 -70px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; background: #000; border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 32px; width: 42px; border-radius: 4px;
            background: linear-gradient(180deg, #3a3a42 0%, #2a2a30 100%);
            border: 1px solid #111; -webkit-appearance: none; margin-top: -13px;
        }

        .status-panel {
            background: var(--bg-panel); border-radius: 8px; padding: 12px; margin-bottom: 12px;
            border-left: 4px solid var(--text-muted); display: flex; flex-direction: column; min-height: 65px;
        }
        .status-title { font-size: 9px; text-transform: uppercase; font-weight: 700; color: rgba(255,255,255,0.5); margin-bottom: 4px; }
        .status-text { font-family: monospace; font-size: 13px; font-weight: bold; color: #fff; }

        .hidden { display: none !important; }
        .setup-input {
            width: 100%; background: #000; border: 1px solid var(--border-color);
            color: #fff; padding: 12px; border-radius: 6px; margin-bottom: 14px; font-family: monospace;
        }
        .setup-label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900; font-size: 18px; letter-spacing: 1px;">PRO<span style="color: #2481cc;">CTRL</span></div>
        <div style="display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);">
            <span id="conn-dot" class="status-dot offline"></span>
            <span id="conn-text" style="font-size: 11px; font-weight: bold; color: #808089;">Offline</span>
        </div>
    </div>

    <div class="content-area">
        <!-- MAIN TAB -->
        <div id="tab-main" class="tab-content">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
                <button class="hw-btn btn-go" onclick="fire('99/1/1')">WAKE ON LAN</button>
                <button class="hw-btn btn-stop" onclick="fire('99/2/4')">ALL BLACKOUT</button>
            </div>
            <div id="stat-ma2" class="status-panel" style="border-left-color: var(--accent-ma2);">
                <div class="status-title">grandMA2 Status</div>
                <div id="txt-ma2" class="status-text">Awaiting data...</div>
            </div>
            <div id="stat-reso" class="status-panel" style="border-left-color: var(--accent-reso);">
                <div class="status-title">Resolume Status</div>
                <div id="txt-reso" class="status-text">Awaiting data...</div>
            </div>
            <div id="stat-wing" class="status-panel" style="border-left-color: var(--accent-wing);">
                <div class="status-title">Wing Status</div>
                <div id="txt-wing" class="status-text">Awaiting data...</div>
            </div>
            <div id="stat-mplay" class="status-panel" style="border-left-color: var(--accent-mplay);">
                <div class="status-title">MultiPlay Active Cue</div>
                <div id="txt-mplay" class="status-text">Awaiting data...</div>
            </div>
        </div>

        <!-- MA2 TAB -->
        <div id="tab-ma2" class="tab-content hidden">
            <div style="font-size: 11px; font-weight: bold; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase;">Encoders</div>
            <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 12px;">
                <div style="display:flex; flex-direction:column; gap:2px;"><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/1')">+</button><span style="font-size:8px; text-align:center; color:#888;">ENC 1</span><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/2')">-</button></div>
                <div style="display:flex; flex-direction:column; gap:2px;"><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/3')">+</button><span style="font-size:8px; text-align:center; color:#888;">ENC 2</span><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/4')">-</button></div>
                <div style="display:flex; flex-direction:column; gap:2px;"><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/5')">+</button><span style="font-size:8px; text-align:center; color:#888;">ENC 3</span><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/6')">-</button></div>
                <div style="display:flex; flex-direction:column; gap:2px;"><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/7')">+</button><span style="font-size:8px; text-align:center; color:#888;">ENC 4</span><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/8')">-</button></div>
                <div style="display:flex; flex-direction:column; gap:2px;"><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/9')">+</button><span style="font-size:8px; text-align:center; color:#888;">ENC 5</span><button class="hw-btn" style="padding:10px 0;" onclick="fire('2/1/10')">-</button></div>
            </div>
            <div style="font-size: 11px; font-weight: bold; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase;">Programmer</div>
            <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 12px;">
                <button class="hw-btn" style="font-size:10px; padding:12px 2px;" onclick="fire('2/2/1')">PREV</button>
                <button class="hw-btn" style="font-size:10px; padding:12px 2px;" onclick="fire('2/2/2')">NEXT</button>
                <button class="hw-btn" style="font-size:10px; padding:12px 2px;" onclick="fire('2/2/3')">HIGH</button>
                <button class="hw-btn" style="font-size:10px; padding:12px 2px;" onclick="fire('2/2/4')">THRU</button>
                <button class="hw-btn" style="font-size:10px; padding:12px 2px;" onclick="fire('2/2/5')">FULL</button>
            </div>
        </div>

        <!-- RESOLUME TAB -->
        <div id="tab-reso" class="tab-content hidden">
            <div style="font-size: 11px; font-weight: bold; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase;">Transport</div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px;">
                <button class="hw-btn" onclick="fire('3/1/1')">TRIG SEL</button>
                <button class="hw-btn" onclick="fire('3/1/2')">CUT</button>
                <button class="hw-btn" onclick="fire('3/1/3')">AUTO</button>
            </div>
        </div>

        <!-- WING TAB -->
        <div id="tab-wing" class="tab-content hidden">
            <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px;">
                <div class="fader-container" style="min-width: 65px;">
                    <span class="fader-label">CH1</span>
                    <button class="hw-btn" style="width:100%; margin-bottom:8px; padding:8px 0; font-size:11px;" onclick="fire('4/1/1')">M</button>
                    <div class="fader-track-wrapper"><input type="range" min="0" max="100" value="75" oninput="faderChange('fad_wing_1', this.value)"></div>
                </div>
                <div class="fader-container" style="min-width: 65px;">
                    <span class="fader-label">CH2</span>
                    <button class="hw-btn" style="width:100%; margin-bottom:8px; padding:8px 0; font-size:11px;" onclick="fire('4/1/2')">M</button>
                    <div class="fader-track-wrapper"><input type="range" min="0" max="100" value="75" oninput="faderChange('fad_wing_2', this.value)"></div>
                </div>
            </div>
        </div>

        <!-- MPLAY TAB -->
        <div id="tab-mplay" class="tab-content hidden" style="display: flex; flex-direction: column; justify-content: center; gap: 12px; height: 100%;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="hw-btn" style="padding: 20px 0; font-size: 16px;" onclick="fire('5/1/1')">PREV CUE</button>
                <button class="hw-btn" style="padding: 20px 0; font-size: 16px;" onclick="fire('5/1/2')">NEXT CUE</button>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                <button class="hw-btn btn-stop" style="padding: 24px 0; font-size: 18px;" onclick="fire('5/1/5')">STOP ALL</button>
                <button class="hw-btn btn-go" style="padding: 24px 0; font-size: 22px;" onclick="fire('5/1/6')">GO</button>
            </div>
        </div>

        <!-- SETUP TAB -->
        <div id="tab-setup" class="tab-content hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h2 style="font-size: 16px; font-weight: bold; margin:0;">Connection Setup</h2>
                <button style="background: #2481cc; color: white; border: none; font-weight: bold; padding: 8px 14px; border-radius: 6px; font-size: 12px;" onclick="saveSettings()">SAVE</button>
            </div>

            <label class="setup-label">Companion Vercel Proxy URL</label>
            <input type="text" id="cfg-url" class="setup-input" placeholder="/api/companion">

            <label class="setup-label">Status Monitor Polling Rate (ms)</label>
            <input type="number" id="cfg-poll" class="setup-input" value="1500">

            <label class="setup-label">MA2 Status Button</label>
            <input type="text" id="cfg-stat-ma2" class="setup-input" value="99/1/1">
            <label class="setup-label">Resolume Status Button</label>
            <input type="text" id="cfg-stat-reso" class="setup-input" value="99/1/2">
            <label class="setup-label">Wing Status Button</label>
            <input type="text" id="cfg-stat-wing" class="setup-input" value="99/1/3">
            <label class="setup-label">MultiPlay Status Button</label>
            <input type="text" id="cfg-stat-mplay" class="setup-input" value="99/1/4">
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('main', this)">MAIN</button>
        <button class="nav-btn" onclick="switchTab('ma2', this)">MA2</button>
        <button class="nav-btn" onclick="switchTab('reso', this)">RESO</button>
        <button class="nav-btn" onclick="switchTab('wing', this)">WING</button>
        <button class="nav-btn" onclick="switchTab('mplay', this)">MPLAY</button>
        <button class="nav-btn" onclick="switchTab('setup', this)">SETUP</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let cfg = {
            url: '/api/companion',
            poll: 1500,
            stat_ma2: '99/1/1',
            stat_reso: '99/1/2',
            stat_wing: '99/1/3',
            stat_mplay: '99/1/4'
        };

        function init() {
            const saved = localStorage.getItem('proctrl_cfg');
            if (saved) cfg = { ...cfg, ...JSON.parse(saved) };
            
            document.getElementById('cfg-url').value = cfg.url;
            document.getElementById('cfg-poll').value = cfg.poll;
            document.getElementById('cfg-stat-ma2').value = cfg.stat_ma2;
            document.getElementById('cfg-stat-reso').value = cfg.stat_reso;
            document.getElementById('cfg-stat-wing').value = cfg.stat_wing;
            document.getElementById('cfg-stat-mplay').value = cfg.stat_mplay;

            pollStatusLoop();
        }

        function saveSettings() {
            cfg.url = document.getElementById('cfg-url').value.replace(/\/$/, '');
            cfg.poll = parseInt(document.getElementById('cfg-poll').value) || 1500;
            cfg.stat_ma2 = document.getElementById('cfg-stat-ma2').value;
            cfg.stat_reso = document.getElementById('cfg-stat-reso').value;
            cfg.stat_wing = document.getElementById('cfg-stat-wing').value;
            cfg.stat_mplay = document.getElementById('cfg-stat-mplay').value;

            localStorage.setItem('proctrl_cfg', JSON.stringify(cfg));
            tg.HapticFeedback.notificationOccurred('success');
            switchTab('main', document.querySelector('.nav-btn'));
        }

        function switchTab(tabId, btnEl) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            const target = document.getElementById(`tab-${tabId}`);
            if (target) {
                target.classList.remove('hidden');
                if(tabId === 'mplay') target.style.display = 'flex';
                else target.style.display = 'block';
            }
            btnEl.classList.add('active');
            tg.HapticFeedback.impactOccurred('light');
        }

        async function fire(address) {
            tg.HapticFeedback.impactOccurred('medium');
            if (!cfg.url) return;
            try {
                await fetch(`${cfg.url}/api/location/${address}/press`, { method: 'POST' });
            } catch (err) {
                setOnline(false);
            }
        }

        let throttleTimers = {};
        function faderChange(varName, val) {
            if (!cfg.url || throttleTimers[varName]) return;
            sendCustomVar(varName, val);
            throttleTimers[varName] = setTimeout(() => { throttleTimers[varName] = null; }, 85);
        }

        async function sendCustomVar(name, val) {
            try {
                // Compatible with both Companion 3.x-5.x HTTP APIs
                await fetch(`${cfg.url}/api/custom-variable/${name}?value=${val}`, { method: 'PUT' });
            } catch (e) {}
        }

        async function pollStatusLoop() {
            if (!cfg.url) {
                setTimeout(pollStatusLoop, cfg.poll);
                return;
            }

            try {
                const [ma2, reso, wing, mplay] = await Promise.all([
                    fetchLocationData(cfg.stat_ma2),
                    fetchLocationData(cfg.stat_reso),
                    fetchLocationData(cfg.stat_wing),
                    fetchLocationData(cfg.stat_mplay)
                ]);

                setOnline(true);
                updatePanel('stat-ma2', 'txt-ma2', ma2);
                updatePanel('stat-reso', 'txt-reso', reso);
                updatePanel('stat-wing', 'txt-wing', wing);
                updatePanel('stat-mplay', 'txt-mplay', mplay);
            } catch (err) {
                setOnline(false);
            }

            setTimeout(pollStatusLoop, cfg.poll);
        }

        async function fetchLocationData(address) {
            if (!address) return null;
            const res = await fetch(`${cfg.url}/api/location/${address}`);
            if (!res.ok) return null;
            return await res.json();
        }

        function updatePanel(panelId, textId, data) {
            const panel = document.getElementById(panelId);
            const txt = document.getElementById(textId);
            if (!panel || !txt) return;

            if (data && data.text) {
                txt.innerText = data.text.replace(/\\n/g, '\n');
                if (data.bgcolor !== undefined && data.bgcolor !== 0) {
                    const hexColor = '#' + parseInt(data.bgcolor).toString(16).padStart(6, '0');
                    panel.style.backgroundColor = hexColor + '40';
                    panel.style.borderColor = hexColor;
                } else {
                    panel.style.backgroundColor = 'var(--bg-panel)';
                }
            } else {
                txt.innerText = 'No Data';
            }
        }

        function setOnline(status) {
            const dot = document.getElementById('conn-dot');
            const txt = document.getElementById('conn-text');
            if (status) {
                dot.className = 'status-dot online';
                txt.innerText = 'Online';
            } else {
                dot.className = 'status-dot offline';
                txt.innerText = 'Offline';
            }
        }

        init();
    </script>
</body>
</html>
