<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Show Control Pro</title>
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SortableJS for Drag & Drop Layout -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            /* Software Accent Colors as requested */
            --c-ma2: #eab308;  /* Gold */
            --c-reso: #d946ef; /* Magenta */
            --c-wing: #06b6d4; /* Cyan */
            --c-mp3: #22c55e;  /* Green */
            --c-sys: #ef4444;  /* Red */
        }
        
        body {
            background-color: #09090b;
            color: #f4f4f5;
            overscroll-behavior: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* Edit Mode Styles */
        body.edit-mode .sortable-grid > div {
            border: 1px dashed #52525b;
            background-color: rgba(255,255,255,0.02);
            border-radius: 8px;
            cursor: grab;
            position: relative;
        }
        body.edit-mode .sortable-grid > div::after {
            content: '≡';
            position: absolute;
            top: 2px;
            right: 4px;
            color: #71717a;
            font-size: 16px;
            pointer-events: none;
        }
        body.edit-mode .sortable-grid > div:active { cursor: grabbing; }
        body.edit-mode .hw-btn, body.edit-mode input[type="range"], body.edit-mode select { pointer-events: none; }

        /* Hardware Buttons */
        .hw-btn {
            background: linear-gradient(180deg, #27272a 0%, #18181b 100%);
            border: 1px solid #3f3f46;
            border-bottom-width: 4px;
            border-radius: 8px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.05s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .hw-btn:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
            background: #141417;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Accents */
        .btn-ma2 { border-color: var(--c-ma2); color: var(--c-ma2); }
        .btn-reso { border-color: var(--c-reso); color: var(--c-reso); }
        .btn-wing { border-color: var(--c-wing); color: var(--c-wing); }
        .btn-mp3 { border-color: var(--c-mp3); color: var(--c-mp3); }
        .btn-sys { border-color: var(--c-sys); color: #fff; background: linear-gradient(180deg, #991b1b 0%, #7f1d1d 100%); }

        /* Hardware Faders */
        .fader-vert {
            -webkit-appearance: slider-vertical;
            appearance: slider-vertical;
            width: 44px;
            height: 180px;
            background: #000;
            border-radius: 6px;
            border: 1px solid #27272a;
            outline: none;
            box-shadow: inset 0 6px 10px rgba(0,0,0,1);
            margin: 10px 0;
        }
        .fader-vert::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 50px;
            background: linear-gradient(180deg, #52525b 0%, #27272a 100%);
            border: 2px solid #a1a1aa;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.8), inset 0 2px 2px rgba(255,255,255,0.2);
        }
        
        .fad-ma2::-webkit-slider-thumb { border-color: var(--c-ma2); border-width: 3px; }
        .fad-reso::-webkit-slider-thumb { border-color: var(--c-reso); border-width: 3px; }
        .fad-wing::-webkit-slider-thumb { border-color: var(--c-wing); border-width: 3px; }
        .fad-enc::-webkit-slider-thumb { height: 30px; border-radius: 15px; border-color: #71717a; } /* Dial simulation */

        /* Layout */
        .tab-content { display: none; padding-bottom: 80px; padding-top: 60px;}
        .tab-content.active { display: block; }
        
        .nav-btn.active { color: #fff; border-top-color: #fff; background: rgba(255,255,255,0.05); }
        .nav-btn { border-top: 2px solid transparent; color: #71717a; transition: all 0.2s;}
        
        .led { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .led-on { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .led-off { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }

        select.hw-select {
            background-color: #18181b;
            color: #fff;
            border: 1px solid #3f3f46;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-sm">

    <!-- HEADER -->
    <header class="fixed top-0 w-full h-14 bg-[#18181b] border-b border-[#27272a] flex justify-between items-center px-4 z-50 shadow-md">
        <div class="font-black tracking-widest text-white text-lg">PRO<span class="text-blue-500">CTRL</span></div>
        <div class="flex items-center space-x-3">
            <button id="edit-layout-btn" onclick="toggleEditLayout()" class="text-[10px] font-bold uppercase px-3 py-1.5 rounded bg-[#27272a] border border-[#3f3f46] text-gray-400 active:bg-[#3f3f46]">Edit Layout</button>
            <div class="flex items-center space-x-2 bg-black px-3 py-1 rounded-full border border-[#27272a]">
                <span id="sys-led" class="led led-off"></span>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTENT -->
    <main class="flex-1 overflow-y-auto w-full relative">
        
        <!-- ================= MAIN TAB (Strictly MA2, Reso, Wing) ================= -->
        <div id="tab-main" class="tab-content active px-3 space-y-4">
            
            <div class="grid grid-cols-3 gap-2 sortable-grid" id="main-status-grid">
                <!-- MA2 Status -->
                <div id="pnl-ma2" class="bg-[#18181b] border border-[#27272a] rounded-lg p-3 shadow-inner">
                    <div class="text-[10px] font-black text-[#eab308] tracking-widest mb-1">MA2</div>
                    <div id="disp-stat_ma2" class="font-mono text-xs text-gray-300 truncate">--</div>
                </div>
                <!-- Reso Status -->
                <div id="pnl-reso" class="bg-[#18181b] border border-[#27272a] rounded-lg p-3 shadow-inner">
                    <div class="text-[10px] font-black text-[#d946ef] tracking-widest mb-1">RESOLUME</div>
                    <div id="disp-stat_reso" class="font-mono text-xs text-gray-300 truncate">--</div>
                </div>
                <!-- Wing Status -->
                <div id="pnl-wing" class="bg-[#18181b] border border-[#27272a] rounded-lg p-3 shadow-inner">
                    <div class="text-[10px] font-black text-[#06b6d4] tracking-widest mb-1">WING LVL</div>
                    <div id="disp-stat_wing" class="font-mono text-xs text-gray-300 truncate">--</div>
                </div>
            </div>

            <!-- Main Fast Actions -->
            <div class="grid grid-cols-2 gap-3 sortable-grid" id="main-action-grid">
                <div id="act-wol1"><button onclick="fireBtn('btn_wol_1')" class="hw-btn w-full py-4 text-xs text-gray-300">⚡ WOL MAIN</button></div>
                <div id="act-wol2"><button onclick="fireBtn('btn_wol_2')" class="hw-btn w-full py-4 text-xs text-gray-300">⚡ WOL BACKUP</button></div>
                
                <div id="act-bo-ma2"><button onclick="fireBtn('btn_bo_ma2')" class="hw-btn btn-sys w-full py-5 text-[11px]">BO: MA2</button></div>
                <div id="act-bo-reso"><button onclick="fireBtn('btn_bo_reso')" class="hw-btn btn-sys w-full py-5 text-[11px]">BO: RESO</button></div>
                
                <div id="act-bo-wing" class="col-span-2"><button onclick="fireBtn('btn_bo_wing')" class="hw-btn btn-sys w-full py-5 text-sm">MUTE ALL AUDIO (WING)</button></div>
            </div>
        </div>

        <!-- ================= MA2 TAB ================= -->
        <div id="tab-ma2" class="tab-content px-3 space-y-4">
            
            <!-- Programmer Grid -->
            <div class="bg-[#18181b] p-3 rounded-lg border border-[#27272a]">
                <div class="text-[10px] text-[#eab308] font-bold mb-2 uppercase">Programmer</div>
                <div class="grid grid-cols-3 gap-2 sortable-grid" id="ma2-prog-grid">
                    <div id="m-prg-1"><button onclick="fireBtn('btn_ma2_prev')" class="hw-btn w-full py-3 text-xs btn-ma2">Prev Fix</button></div>
                    <div id="m-prg-2"><button onclick="fireBtn('btn_ma2_next')" class="hw-btn w-full py-3 text-xs btn-ma2">Next Fix</button></div>
                    <div id="m-prg-3"><button onclick="fireBtn('btn_ma2_hl')" class="hw-btn w-full py-3 text-xs text-white bg-blue-900 border-blue-700">Highlt</button></div>
                    <div id="m-prg-4"><button onclick="fireBtn('btn_ma2_thru')" class="hw-btn w-full py-3 text-xs text-gray-300">Thru</button></div>
                    <div id="m-prg-5"><button onclick="fireBtn('btn_ma2_full')" class="hw-btn w-full py-3 text-xs text-gray-900 bg-white border-gray-400">Full</button></div>
                    <div id="m-prg-6"><button onclick="fireBtn('btn_ma2_clear')" class="hw-btn w-full py-3 text-xs text-red-400">Clear</button></div>
                </div>
            </div>

            <!-- Encoders -->
            <div class="bg-[#18181b] p-3 rounded-lg border border-[#27272a]">
                <div class="text-[10px] text-[#eab308] font-bold mb-2 uppercase">Encoders</div>
                <div class="grid grid-cols-4 gap-2 sortable-grid" id="ma2-enc-grid">
                    <div id="enc-pan" class="flex flex-col space-y-1"><span class="text-center text-[9px] text-[#eab308] font-bold">PAN</span>
                        <button onclick="fireBtn('btn_enc_pan_p')" class="hw-btn py-2 text-lg text-gray-300">+</button>
                        <button onclick="fireBtn('btn_enc_pan_m')" class="hw-btn py-2 text-lg text-gray-300">-</button></div>
                    <div id="enc-tilt" class="flex flex-col space-y-1"><span class="text-center text-[9px] text-[#eab308] font-bold">TILT</span>
                        <button onclick="fireBtn('btn_enc_tilt_p')" class="hw-btn py-2 text-lg text-gray-300">+</button>
                        <button onclick="fireBtn('btn_enc_tilt_m')" class="hw-btn py-2 text-lg text-gray-300">-</button></div>
                    <div id="enc-dim" class="flex flex-col space-y-1"><span class="text-center text-[9px] text-[#eab308] font-bold">DIM</span>
                        <button onclick="fireBtn('btn_enc_dim_p')" class="hw-btn py-2 text-lg text-gray-300">+</button>
                        <button onclick="fireBtn('btn_enc_dim_m')" class="hw-btn py-2 text-lg text-gray-300">-</button></div>
                    <div id="enc-foc" class="flex flex-col space-y-1"><span class="text-center text-[9px] text-[#eab308] font-bold">FOCUS</span>
                        <button onclick="fireBtn('btn_enc_foc_p')" class="hw-btn py-2 text-lg text-gray-300">+</button>
                        <button onclick="fireBtn('btn_enc_foc_m')" class="hw-btn py-2 text-lg text-gray-300">-</button></div>
                </div>
            </div>

            <!-- Executors (1-10) -->
            <div class="bg-[#18181b] p-3 rounded-lg border border-[#27272a] overflow-x-auto hide-scroll">
                <div class="flex space-x-3 sortable-grid w-max" id="ma2-exec-grid">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>

        <!-- ================= RESOLUME TAB ================= -->
        <div id="tab-reso" class="tab-content px-3 space-y-4">
            
            <!-- Routing & Columns -->
            <div class="bg-[#18181b] p-3 rounded-lg border border-[#27272a] space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] text-[#d946ef] font-bold uppercase">Deck / Column</span>
                    <select id="reso-deck-sel" class="hw-select" onchange="haptic('light')">
                        <option>Deck 1 (Main)</option>
                        <option>Deck 2 (Graphics)</option>
                        <option>Deck 3 (Logos)</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-4 gap-2 sortable-grid" id="reso-mat-grid">
                    <div id="rm-c1"><button onclick="fireBtn('btn_res_c1')" class="hw-btn w-full py-3 text-[10px] text-gray-300">COL 1</button></div>
                    <div id="rm-c2"><button onclick="fireBtn('btn_res_c2')" class="hw-btn w-full py-3 text-[10px] text-gray-300">COL 2</button></div>
                    <div id="rm-c3"><button onclick="fireBtn('btn_res_c3')" class="hw-btn w-full py-3 text-[10px] text-gray-300">COL 3</button></div>
                    <div id="rm-c4"><button onclick="fireBtn('btn_res_c4')" class="hw-btn w-full py-3 text-[10px] text-gray-300">COL 4</button></div>
                    <div id="rm-c5"><button onclick="fireBtn('btn_res_c5')" class="hw-btn w-full py-3 text-[10px] text-gray-300">COL 5</button></div>
                    <div id="rm-c6"><button onclick="fireBtn('btn_res_c6')" class="hw-btn w-full py-3 text-[10px] text-gray-300">COL 6</button></div>
                    <div id="rm-prev"><button onclick="fireBtn('btn_res_cprev')" class="hw-btn w-full py-3 text-[10px] btn-reso">PREV COL</button></div>
                    <div id="rm-next"><button onclick="fireBtn('btn_res_cnext')" class="hw-btn w-full py-3 text-[10px] btn-reso">NEXT COL</button></div>
                </div>
            </div>

            <!-- Faders & Dials -->
            <div class="grid grid-cols-2 gap-3 sortable-grid" id="reso-fader-grid">
                <div id="res-layers" class="bg-[#18181b] p-3 rounded-lg border border-[#27272a] flex overflow-x-auto space-x-3 hide-scroll">
                    <!-- Layer Opacity Faders Injected via JS -->
                </div>
                <div id="res-dials" class="bg-[#18181b] p-3 rounded-lg border border-[#27272a] flex overflow-x-auto space-x-3 hide-scroll">
                    <!-- Composition Dials Injected via JS -->
                </div>
            </div>
            
            <!-- Transitions -->
            <div class="bg-[#18181b] p-3 rounded-lg border border-[#27272a] flex items-center justify-between">
                <span class="text-[10px] font-bold text-[#d946ef]">TRANSITION MODE</span>
                <div class="flex space-x-2">
                    <button onclick="fireBtn('btn_res_cut')" class="hw-btn px-4 py-2 text-[10px] bg-red-900 border-red-700 text-white">CUT</button>
                    <button onclick="fireBtn('btn_res_auto')" class="hw-btn px-4 py-2 text-[10px] btn-reso">AUTO</button>
                </div>
            </div>
        </div>

        <!-- ================= WING TAB ================= -->
        <div id="tab-wing" class="tab-content px-3 h-full">
            <div class="bg-[#18181b] p-4 rounded-lg border border-[#27272a] overflow-x-auto hide-scroll">
                <!-- Wing Faders & DCAs -->
                <div class="flex space-x-4 sortable-grid items-center min-w-max pb-4" id="wing-fader-grid">
                    <!-- Wing Faders injected via JS -->
                </div>
            </div>
        </div>

        <!-- ================= MULTIPLAY TAB ================= -->
        <div id="tab-mp3" class="tab-content px-3">
            <div class="space-y-4 flex flex-col h-[calc(100vh-120px)]">
                
                <!-- EXCLUSIVELY MultiPlay Feedback -->
                <div class="bg-[#18181b] border border-[#27272a] rounded-lg p-4 flex-1 flex flex-col shadow-inner">
                    <div class="text-[10px] text-[#22c55e] font-bold mb-2 uppercase tracking-widest">Active Cue Sequence</div>
                    <div id="disp-stat_mp3_full" class="flex-1 bg-black border border-[#27272a] rounded p-4 font-mono text-xl text-[#22c55e] overflow-y-auto break-words flex items-center justify-center text-center shadow-[inset_0_0_15px_rgba(34,197,94,0.1)]">
                        Awaiting Timeline...
                    </div>
                </div>

                <!-- EXCLUSIVELY MultiPlay Controls -->
                <div class="grid grid-cols-2 gap-3 sortable-grid shrink-0" id="mp3-ctrl-grid">
                    <div id="mpc-1"><button onclick="fireBtn('btn_mp_prev')" class="hw-btn w-full py-5 text-sm text-gray-300">PREV CUE</button></div>
                    <div id="mpc-2"><button onclick="fireBtn('btn_mp_next')" class="hw-btn w-full py-5 text-sm text-gray-300">NEXT CUE</button></div>
                    <div id="mpc-3"><button onclick="fireBtn('btn_mp_stop')" class="hw-btn btn-sys w-full py-5 text-sm font-black tracking-widest">STOP ALL</button></div>
                    <div id="mpc-4"><button onclick="fireBtn('btn_mp_go')" class="hw-btn btn-mp3 w-full py-5 text-2xl font-black tracking-widest">GO</button></div>
                </div>
            </div>
        </div>

        <!-- ================= SETUP TAB ================= -->
        <div id="tab-setup" class="tab-content px-3">
            <div class="bg-[#18181b] border border-[#27272a] rounded-lg p-4 space-y-6">
                
                <!-- Server Config -->
                <div>
                    <h3 class="text-[10px] text-blue-400 font-black tracking-widest uppercase mb-3 border-b border-[#27272a] pb-1">API Connection</h3>
                    <label class="block text-[10px] text-gray-500 mb-1 font-bold">COMPANION SECURE URL (HTTPS)</label>
                    <input type="text" id="cfg-server" placeholder="https://example.crazedns.ru" class="w-full bg-black border border-[#3f3f46] rounded px-3 py-2 text-sm text-white outline-none focus:border-blue-500">
                    <p class="text-[9px] text-gray-500 mt-2">Bitfocus HTTP Remote Control API (v5.0). Ensure CORS is allowed if hosting on a domain.</p>
                </div>

                <div id="setup-form-container" class="space-y-6">
                    <!-- Dynamic Setup Fields Injected Here -->
                </div>

                <button onclick="saveConfig()" class="hw-btn w-full py-4 text-sm font-black text-white bg-blue-700 border-blue-600">SAVE & RECONNECT</button>
            </div>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 w-full h-16 bg-[#18181b] border-t border-[#27272a] flex justify-around items-center px-1 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.3)]">
        <button onclick="nav('main')" class="nav-btn active flex-1 flex flex-col items-center py-2 text-[10px] font-bold uppercase tracking-wider" data-tab="main">Main</button>
        <button onclick="nav('ma2')" class="nav-btn flex-1 flex flex-col items-center py-2 text-[10px] font-bold uppercase tracking-wider" data-tab="ma2">MA2</button>
        <button onclick="nav('reso')" class="nav-btn flex-1 flex flex-col items-center py-2 text-[10px] font-bold uppercase tracking-wider" data-tab="reso">Reso</button>
        <button onclick="nav('wing')" class="nav-btn flex-1 flex flex-col items-center py-2 text-[10px] font-bold uppercase tracking-wider" data-tab="wing">Wing</button>
        <button onclick="nav('mp3')" class="nav-btn flex-1 flex flex-col items-center py-2 text-[10px] font-bold uppercase tracking-wider" data-tab="mp3">MPlay</button>
        <button onclick="nav('setup')" class="nav-btn flex-1 flex flex-col items-center py-2 text-[10px] font-bold uppercase tracking-wider" data-tab="setup">Setup</button>
    </nav>

    <script>
        // --- Telegram SDK & Haptics ---
        let tg;
        try {
            tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();
        } catch(e) {}

        function haptic(style = 'light') {
            if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
        }

        // --- Data Definitions (Dynamic UI & Config) ---
        // Format: key: [Label, DefaultValue, Type(btn=p/r/c, var=variable), Category]
        const MAPPINGS_DEF = {
            // Status Variables
            'stat_ma2': ['MA2 Status Var', 'ma2_status', 'var', 'Feedback Variables'],
            'stat_reso': ['Resolume Status Var', 'reso_cue', 'var', 'Feedback Variables'],
            'stat_wing': ['Wing Status Var', 'wing_level', 'var', 'Feedback Variables'],
            'stat_mp3': ['MultiPlay Status Var', 'mp3_cue', 'var', 'Feedback Variables'],
            
            // Main App Actions
            'btn_wol_1': ['WOL Main', '99/1/1', 'btn', 'Main Grid Buttons'],
            'btn_wol_2': ['WOL Backup', '99/1/2', 'btn', 'Main Grid Buttons'],
            'btn_bo_ma2': ['MA2 Blackout', '99/2/1', 'btn', 'Main Grid Buttons'],
            'btn_bo_reso': ['Reso Blackout', '99/2/2', 'btn', 'Main Grid Buttons'],
            'btn_bo_wing': ['Wing Mute All', '99/2/3', 'btn', 'Main Grid Buttons'],

            // MA2 Buttons
            'btn_ma2_prev': ['MA2 Prev Fix', '2/1/1', 'btn', 'MA2 Programmer'],
            'btn_ma2_next': ['MA2 Next Fix', '2/1/2', 'btn', 'MA2 Programmer'],
            'btn_ma2_hl': ['MA2 Highlight', '2/1/3', 'btn', 'MA2 Programmer'],
            'btn_ma2_thru': ['MA2 Thru', '2/1/4', 'btn', 'MA2 Programmer'],
            'btn_ma2_full': ['MA2 Full', '2/1/5', 'btn', 'MA2 Programmer'],
            'btn_ma2_clear': ['MA2 Clear', '2/1/6', 'btn', 'MA2 Programmer'],
            'btn_enc_pan_p': ['Pan +', '2/2/1', 'btn', 'MA2 Programmer'],
            'btn_enc_pan_m': ['Pan -', '2/2/2', 'btn', 'MA2 Programmer'],
            'btn_enc_tilt_p': ['Tilt +', '2/2/3', 'btn', 'MA2 Programmer'],
            'btn_enc_tilt_m': ['Tilt -', '2/2/4', 'btn', 'MA2 Programmer'],
            'btn_enc_dim_p': ['Dim +', '2/2/5', 'btn', 'MA2 Programmer'],
            'btn_enc_dim_m': ['Dim -', '2/2/6', 'btn', 'MA2 Programmer'],
            'btn_enc_foc_p': ['Focus +', '2/2/7', 'btn', 'MA2 Programmer'],
            'btn_enc_foc_m': ['Focus -', '2/2/8', 'btn', 'MA2 Programmer'],
            
            // Resolume
            'btn_res_c1': ['Col 1', '3/1/1', 'btn', 'Resolume Grid'],
            'btn_res_c2': ['Col 2', '3/1/2', 'btn', 'Resolume Grid'],
            'btn_res_c3': ['Col 3', '3/1/3', 'btn', 'Resolume Grid'],
            'btn_res_c4': ['Col 4', '3/1/4', 'btn', 'Resolume Grid'],
            'btn_res_c5': ['Col 5', '3/1/5', 'btn', 'Resolume Grid'],
            'btn_res_c6': ['Col 6', '3/1/6', 'btn', 'Resolume Grid'],
            'btn_res_cprev': ['Prev Col', '3/1/7', 'btn', 'Resolume Grid'],
            'btn_res_cnext': ['Next Col', '3/1/8', 'btn', 'Resolume Grid'],
            'btn_res_cut': ['Cut Trans', '3/2/1', 'btn', 'Resolume Grid'],
            'btn_res_auto': ['Auto Trans', '3/2/2', 'btn', 'Resolume Grid'],

            // MultiPlay Isolated
            'btn_mp_prev': ['MP Prev', '4/1/1', 'btn', 'MultiPlay Cues'],
            'btn_mp_next': ['MP Next', '4/1/2', 'btn', 'MultiPlay Cues'],
            'btn_mp_stop': ['MP Stop', '4/1/3', 'btn', 'MultiPlay Cues'],
            'btn_mp_go': ['MP GO', '4/1/4', 'btn', 'MultiPlay Cues']
        };

        // Inject dynamic sequences
        // 10 MA2 Executors
        for(let i=1; i<=10; i++) {
            MAPPINGS_DEF[`btn_ma2_ex${i}`] = [`Exec ${i} Btn`, `2/3/${i}`, 'btn', 'MA2 Executors'];
            MAPPINGS_DEF[`fad_ma2_ex${i}`] = [`Exec ${i} Fader Var`, `fader_ma2_${i}`, 'var', 'MA2 Executors'];
        }
        // Resolume: 4 Layers, 4 Dials
        for(let i=1; i<=4; i++) {
            MAPPINGS_DEF[`fad_res_l${i}`] = [`Layer ${i} Opacity`, `reso_layer_${i}`, 'var', 'Resolume Faders'];
            MAPPINGS_DEF[`fad_res_d${i}`] = [`Dial ${i} Var`, `reso_dial_${i}`, 'var', 'Resolume Faders'];
        }
        // Wing: 5 Channels, 2 DCAs, 1 Master
        for(let i=1; i<=5; i++) {
            MAPPINGS_DEF[`btn_wing_ch${i}`] = [`Ch ${i} Mute`, `5/1/${i}`, 'btn', 'Wing Mix Desk'];
            MAPPINGS_DEF[`fad_wing_ch${i}`] = [`Ch ${i} Fader Var`, `fader_wing_ch${i}`, 'var', 'Wing Mix Desk'];
        }
        for(let i=1; i<=2; i++) {
            MAPPINGS_DEF[`btn_wing_dca${i}`] = [`DCA ${i} Mute`, `5/2/${i}`, 'btn', 'Wing Mix Desk'];
            MAPPINGS_DEF[`fad_wing_dca${i}`] = [`DCA ${i} Fader Var`, `fader_wing_dca${i}`, 'var', 'Wing Mix Desk'];
        }
        MAPPINGS_DEF[`btn_wing_master`] = [`Master Mute`, `5/3/1`, 'btn', 'Wing Mix Desk'];
        MAPPINGS_DEF[`fad_wing_master`] = [`Master Fader Var`, `fader_wing_master`, 'var', 'Wing Mix Desk'];

        // Current App State
        let config = { server: 'https://127.0.0.1:8000', maps: {} };
        let pollInterval = null;

        // --- DOM Generators ---
        function generateHardwareDOM() {
            // MA2 Executors
            const exGrid = document.getElementById('ma2-exec-grid');
            for(let i=1; i<=10; i++) {
                exGrid.innerHTML += `
                    <div id="m-ex-${i}" class="flex flex-col items-center shrink-0 w-12">
                        <span class="text-[9px] font-mono text-[#eab308] font-bold mb-1">EX ${i}</span>
                        <input type="range" min="0" max="100" value="0" class="fader-vert fad-ma2" oninput="sendVal('fad_ma2_ex${i}', this.value)">
                        <button onclick="fireBtn('btn_ma2_ex${i}')" class="hw-btn btn-ma2 w-full py-2 text-[9px] mt-2">GO</button>
                    </div>`;
            }
            
            // Resolume
            const resLayers = document.getElementById('res-layers');
            for(let i=1; i<=4; i++) {
                resLayers.innerHTML += `
                    <div id="r-l-${i}" class="flex flex-col items-center shrink-0 w-10">
                        <span class="text-[9px] font-mono text-[#d946ef] mb-1">L${i}</span>
                        <input type="range" min="0" max="100" value="100" class="fader-vert fad-reso !h-24" oninput="sendVal('fad_res_l${i}', this.value)">
                    </div>`;
            }
            const resDials = document.getElementById('res-dials');
            for(let i=1; i<=4; i++) {
                resDials.innerHTML += `
                    <div id="r-d-${i}" class="flex flex-col items-center shrink-0 w-10">
                        <span class="text-[9px] font-mono text-gray-400 mb-1">D${i}</span>
                        <input type="range" min="0" max="100" value="50" class="fader-vert fad-enc !h-24" oninput="sendVal('fad_res_d${i}', this.value)">
                    </div>`;
            }

            // Wing Faders (5 CH, 2 DCA, 1 MASTER)
            const wGrid = document.getElementById('wing-fader-grid');
            
            // 5 Channels
            for(let i=1; i<=5; i++) {
                wGrid.innerHTML += `
                    <div id="w-ch-${i}" class="flex flex-col items-center h-full justify-center shrink-0 w-14">
                        <span class="text-[10px] font-black text-gray-400 border-b border-[#27272a] w-full text-center pb-2 mb-2">CH ${i}</span>
                        <button onclick="fireBtn('btn_wing_ch${i}')" class="hw-btn w-12 py-2 text-[10px] text-orange-500 border-orange-700 mb-2">MUTE</button>
                        <input type="range" min="0" max="100" value="0" class="fader-vert fad-wing flex-1 !h-auto min-h-[150px]" oninput="sendVal('fad_wing_ch${i}', this.value)">
                    </div>`;
            }
            
            // Space divider
            wGrid.innerHTML += `<div class="w-2 border-r border-[#27272a] h-40"></div>`;

            // 2 DCAs
            for(let i=1; i<=2; i++) {
                wGrid.innerHTML += `
                    <div id="w-dca-${i}" class="flex flex-col items-center h-full justify-center shrink-0 w-14">
                        <span class="text-[10px] font-black text-purple-400 border-b border-[#27272a] w-full text-center pb-2 mb-2">DCA ${i}</span>
                        <button onclick="fireBtn('btn_wing_dca${i}')" class="hw-btn w-12 py-2 text-[10px] text-orange-500 border-orange-700 mb-2">MUTE</button>
                        <input type="range" min="0" max="100" value="0" class="fader-vert fad-wing flex-1 !h-auto min-h-[150px]" oninput="sendVal('fad_wing_dca${i}', this.value)">
                    </div>`;
            }

            // Space divider
            wGrid.innerHTML += `<div class="w-2 border-r border-[#27272a] h-40"></div>`;

            // Master
            wGrid.innerHTML += `
                <div id="w-master" class="flex flex-col items-center h-full justify-center shrink-0 w-16">
                    <span class="text-[11px] font-black text-[#06b6d4] border-b border-[#27272a] w-full text-center pb-2 mb-2">MASTER</span>
                    <button onclick="fireBtn('btn_wing_master')" class="hw-btn w-14 py-2 text-[10px] btn-sys mb-2">MUTE</button>
                    <input type="range" min="0" max="100" value="80" class="fader-vert fad-wing flex-1 !h-auto min-h-[150px]" oninput="sendVal('fad_wing_master', this.value)">
                </div>`;
        }

        function generateSetupDOM() {
            const container = document.getElementById('setup-form-container');
            container.innerHTML = '';
            const categories = {};
            
            Object.keys(MAPPINGS_DEF).forEach(key => {
                const cat = MAPPINGS_DEF[key][3];
                if(!categories[cat]) categories[cat] = [];
                categories[cat].push(key);
            });

            for(const cat in categories) {
                let html = `<div><h3 class="text-[10px] text-blue-400 font-black tracking-widest uppercase mb-3 border-b border-[#27272a] pb-1 mt-4">${cat}</h3><div class="grid grid-cols-2 gap-3">`;
                
                categories[cat].forEach(key => {
                    const def = MAPPINGS_DEF[key];
                    const val = config.maps[key] || def[1];
                    const ph = def[2] === 'btn' ? 'P/R/C (e.g. 1/0/1)' : 'Variable Name';
                    html += `
                        <div>
                            <label class="block text-[9px] text-gray-500 mb-1 font-bold truncate">${def[0]}</label>
                            <input type="text" id="cfg-${key}" value="${val}" placeholder="${ph}" class="w-full bg-black border border-[#3f3f46] rounded px-2 py-1.5 text-xs text-white outline-none focus:border-blue-500">
                        </div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        // --- HTTP Engine ---
        async function fetchAPI(path, method = 'GET', bodyObj = null) {
            const baseUrl = config.server.replace(/\/$/, "");
            if(!baseUrl || !baseUrl.startsWith('http')) return null;
            
            const options = { 
                method, 
                headers: { 'Content-Type': 'application/json' },
                signal: AbortSignal.timeout(2000)
            };
            if(bodyObj) options.body = JSON.stringify(bodyObj);
            
            try {
                const res = await fetch(`${baseUrl}${path}`, options);
                if(!res.ok) throw new Error(res.status);
                const txt = await res.text();
                return txt ? JSON.parse(txt) : {};
            } catch (err) {
                throw err;
            }
        }

        // Trailing-edge throttle for Faders
        function throttleTrailing(func, limit) {
            let timeout, lastRan;
            return function(...args) {
                if (!lastRan) {
                    func.apply(this, args); lastRan = Date.now();
                } else {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => {
                        if ((Date.now() - lastRan) >= limit) {
                            func.apply(this, args); lastRan = Date.now();
                        }
                    }, limit - (Date.now() - lastRan));
                }
            }
        }

        function getMap(key) { return config.maps[key] || MAPPINGS_DEF[key][1]; }

        const fireBtn = (key) => {
            haptic('medium');
            const loc = getMap(key).split('/');
            if(loc.length === 3) {
                fetchAPI(`/api/location/${loc[0]}/${loc[1]}/${loc[2]}/press`, 'POST').catch(()=>{});
            }
        };

        const sendVal = throttleTrailing((key, value) => {
            const varName = getMap(key);
            fetchAPI(`/api/custom-variable/${varName}`, 'PUT', { value }).catch(()=>{});
        }, 100);

        // --- Polling ---
        async function pollData() {
            const vars = ['stat_ma2', 'stat_reso', 'stat_wing', 'stat_mp3'];
            try {
                const promises = vars.map(v => fetchAPI(`/api/custom-variable/${getMap(v)}`));
                const results = await Promise.all(promises);
                
                results.forEach((res, i) => {
                    const val = (res && res.value !== undefined) ? res.value : '--';
                    
                    if (vars[i] === 'stat_mp3') {
                        // EXCLUSIVE MultiPlay Status Update
                        const mp3FullEl = document.getElementById('disp-stat_mp3_full');
                        if (mp3FullEl) mp3FullEl.innerText = val !== '--' ? val : 'Awaiting Timeline...';
                    } else {
                        // Regular status updates for Main Tab panels
                        const displayEl = document.getElementById(`disp-${vars[i]}`);
                        if (displayEl) displayEl.innerText = val;
                    }
                });
                document.getElementById('sys-led').className = 'led led-on';
            } catch (error) {
                document.getElementById('sys-led').className = 'led led-off';
            }
        }

        // --- Sortable Layout Engine ---
        let sortableInstances = [];
        let isEditMode = false;

        function toggleEditLayout() {
            isEditMode = !isEditMode;
            document.body.classList.toggle('edit-mode', isEditMode);
            const btn = document.getElementById('edit-layout-btn');
            
            if(isEditMode) {
                haptic('heavy');
                btn.classList.add('bg-blue-600', 'text-white', 'border-blue-500');
                btn.innerText = 'Save Layout';
                
                document.querySelectorAll('.sortable-grid').forEach(el => {
                    sortableInstances.push(new Sortable(el, {
                        animation: 150,
                        delay: 100,
                        delayOnTouchOnly: true
                    }));
                });
            } else {
                haptic('light');
                btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-500');
                btn.innerText = 'Edit Layout';
                
                sortableInstances.forEach(s => s.destroy());
                sortableInstances = [];
                saveLayout();
            }
        }

        function saveLayout() {
            const layout = {};
            document.querySelectorAll('.sortable-grid').forEach(grid => {
                layout[grid.id] = Array.from(grid.children).map(c => c.id);
            });
            localStorage.setItem('proctrl_layout', JSON.stringify(layout));
        }

        function restoreLayout() {
            const saved = JSON.parse(localStorage.getItem('proctrl_layout') || '{}');
            Object.keys(saved).forEach(gridId => {
                const grid = document.getElementById(gridId);
                if(grid) {
                    saved[gridId].forEach(childId => {
                        const child = document.getElementById(childId);
                        if(child) grid.appendChild(child);
                    });
                }
            });
        }

        // --- App Initialization ---
        function loadConfig() {
            const saved = localStorage.getItem('proctrl_config');
            if(saved) config = JSON.parse(saved);
            
            document.getElementById('cfg-server').value = config.server || 'https://127.0.0.1:8000';
            generateSetupDOM();
            
            if(pollInterval) clearInterval(pollInterval);
            pollData();
            pollInterval = setInterval(pollData, 1500);
        }

        function saveConfig() {
            haptic('heavy');
            config.server = document.getElementById('cfg-server').value;
            config.maps = {};
            
            Object.keys(MAPPINGS_DEF).forEach(key => {
                const input = document.getElementById(`cfg-${key}`);
                if(input) config.maps[key] = input.value;
            });
            
            localStorage.setItem('proctrl_config', JSON.stringify(config));
            
            document.getElementById('sys-led').className = 'led led-off';
            if(pollInterval) clearInterval(pollInterval);
            pollData();
            pollInterval = setInterval(pollData, 1500);
            
            if(tg) tg.showAlert("Settings Saved & Reconnected.");
            nav('setup'); // Stay on setup tab to confirm save visually
        }

        // --- Navigation ---
        function nav(tabId) {
            if(isEditMode) toggleEditLayout();
            haptic('light');
            
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            const activeBtn = document.querySelector(`[data-tab="${tabId}"]`);
            if(activeBtn) activeBtn.classList.add('active');
        }

        // Boot Sequence
        window.onload = () => {
            generateHardwareDOM();
            loadConfig();
            restoreLayout();
        };
    </script>
</body>
</html>
