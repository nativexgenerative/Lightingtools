<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Companion TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 10px; padding: 18px;
            font-size: 16px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: opacity 0.1s;
        }
        button:active { opacity: 0.7; transform: scale(0.98); }
        .console-box {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; border-radius: 8px; font-family: monospace;
            font-size: 14px; min-height: 50px;
            white-space: pre-wrap;
        }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .online { background-color: #4CAF50; }
        .offline { background-color: #F44336; }
        .header { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Show Control</h2>
        <div><span id="dot" class="status-dot offline"></span> <span id="conn-text">Checking...</span></div>
    </div>

    <!-- UI Buttons -->
    <button onclick="pressButton(1, 0, 1)">💡 grandMA2: Main GO</button>
    <button onclick="pressButton(1, 0, 2)">📺 Resolume: Next Clip</button>
    <button onclick="pressButton(1, 0, 3)">🎵 MultiPlay: GO</button>
    <button onclick="pressButton(1, 0, 4)">🎚️ Wing: Unmute LR</button>

    <h3 style="margin-top: 20px;">System Feedback</h3>
    <div id="feedback" class="console-box">Initializing connection...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- CONFIGURATION ---
        // Your public-facing Companion HTTPS address
        const COMPANION_URL = 'https://your-companion-domain-or-ip:8443'; 
        
        // If you generated a REST API Key in Companion Settings, add it here
        const API_HEADERS = {
            'Content-Type': 'application/json'
            // 'Authorization': 'Bearer YOUR_REST_API_KEY_HERE' 
        };

        const feedbackDiv = document.getElementById('feedback');
        const dot = document.getElementById('dot');
        const connText = document.getElementById('conn-text');

        // --- COMMAND TRANSMISSION ---
        async function pressButton(page, row, col) {
            try {
                const url = `${COMPANION_URL}/api/location/${page}/${row}/${col}/press`;
                const response = await fetch(url, { method: 'POST', headers: API_HEADERS });
                
                if (response.ok) {
                    tg.HapticFeedback.impactOccurred('medium'); 
                    logFeedback(`Success: Triggered Page ${page} / R${row} / C${col}`);
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                tg.HapticFeedback.notificationOccurred('error');
                logFeedback(`Error sending command: ${error.message}`);
            }
        }

        // --- STATUS FEEDBACK (POLLING) ---
        // To get feedback without a WebSocket relay, we poll the state of a specific Companion button
        // Set up a button in Companion (e.g., Page 1, Row 1, Col 1) specifically to display system status text.
        async function pollStatus() {
            try {
                // Fetch the properties of the status button (Page 1, Row 1, Col 1)
                const url = `${COMPANION_URL}/api/location/1/1/1`;
                const response = await fetch(url, { method: 'GET', headers: API_HEADERS });
                
                if (response.ok) {
                    const data = await response.json();
                    setOnlineState(true);
                    
                    // Display the text currently rendered on that Companion button
                    if(data && data.text) {
                        feedbackDiv.innerText = data.text.replace(/\\n/g, '\n');
                    }
                } else {
                    setOnlineState(false);
                }
            } catch (error) {
                setOnlineState(false);
            }
        }

        function setOnlineState(isOnline) {
            dot.className = isOnline ? 'status-dot online' : 'status-dot offline';
            connText.innerText = isOnline ? 'Online' : 'Offline';
        }

        function logFeedback(msg) {
            feedbackDiv.innerText = msg;
        }

        // Check connection & gear status every 1.5 seconds
        setInterval(pollStatus, 1500);
        pollStatus(); 
    </script>
</body>
</html>
