<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Show Control Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root {
            --ma2: #ffd700;
            --reso: #ff00ff;
            --wing: #00ffff;
            --mp3: #00ff00;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overscroll-behavior: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* Hardware Button Styling */
        .hw-btn {
            background: linear-gradient(180deg, #222 0%, #111 100%);
            border: 1px solid #333;
            border-bottom-width: 4px;
            border-radius: 6px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.05s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            color: #ddd;
        }
        .hw-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            background: #151515;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Color Accents */
        .btn-ma2 { border-color: var(--ma2); color: var(--ma2); }
        .btn-reso { border-color: var(--reso); color: var(--reso); }
        .btn-wing { border-color: var(--wing); color: var(--wing); }
        .btn-mp3 { border-color: var(--mp3); color: var(--mp3); }
        .btn-sys { border-color: #ff3333; color: #fff; background: linear-gradient(180deg, #660000 0%, #440000 100%); }

        /* Vertical Faders */
        .fader-vert {
            -webkit-appearance: slider-vertical;
            appearance: slider-vertical;
            width: 32px;
            height: 180px;
            background: #000;
            border-radius: 4px;
            border: 1px solid #222;
            outline: none;
            box-shadow: inset 0 4px 8px rgba(0,0,0,1);
            margin: 8px 0;
        }
        .fader-vert::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 36px;
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border: 2px solid #888;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.8);
        }

        .fad-ma2::-webkit-slider-thumb { border-color: var(--ma2); }
        .fad-reso::-webkit-slider-thumb { border-color: var(--reso); }
        .fad-wing::-webkit-slider-thumb { border-color: var(--wing); }

        /* Edit Mode Styles */
        body.edit-mode .sortable-group > div {
            border: 1px dashed #555;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            cursor: grab;
        }
        body.edit-mode .hw-btn, body.edit-mode input { pointer-events: none; }

        .led { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .led-on { background-color: var(--mp3); box-shadow: 0 0 8px var(--mp3); }
        .led-off { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-xs">

    <!-- HEADER -->
    <header class="h-14 bg-[#111] border-b border-[#222] flex justify-between items-center px-4 shrink-0 z-50">
        <div class="font-black tracking-widest text-lg">PRO<span class="text-blue-500">CTRL</span></div>
        <div class="flex items-center space-x-3">
            <button id="edit-btn" onclick="toggleEdit()" class="px-3 py-1.5 rounded bg-[#222] border border-[#333] font-bold text-[10px] uppercase">Edit Layout</button>
            <div class="bg-black px-2 py-1 rounded-full border border-[#222]">
                <span id="sys-led" class="led led-off"></span>
            </div>
        </div>
    </header>

    <!-- TAB CONTAINER -->
    <main class="flex-1 relative overflow-y-auto overflow-x-hidden bg-[#0a0a0a]">
        
        <!-- ================= MAIN TAB ================= -->
        <div id="tab-main" class="tab-pane flex flex-col p-3 space-y-4 min-h-full">
            
            <!-- Status Panels -->
            <div class="grid grid-cols-2 gap-3 sortable-group" id="grid-status">
                <div class="bg-[#111] border border-[#222] rounded p-3">
                    <div class="text-[10px] font-black text-[#ffd700] mb-1">MA2 STATUS</div>
                    <div id="disp-stat_ma2" class="font-mono text-gray-400 truncate">Waiting...</div>
                </div>
                <div class="bg-[#111] border border-[#222] rounded p-3">
                    <div class="text-[10px] font-black text-[#ff00ff] mb-1">RESO STATUS</div>
                    <div id="disp-stat_reso" class="font-mono text-gray-400 truncate">Waiting...</div>
                </div>
                <div class="bg-[#111] border border-[#222] rounded p-3">
                    <div class="text-[10px] font-black text-[#00ffff] mb-1">WING STATUS</div>
                    <div id="disp-stat_wing" class="font-mono text-gray-400 truncate">Waiting...</div>
                </div>
                <div class="bg-[#111] border border-[#222] rounded p-3">
                    <div class="text-[10px] font-black text-[#00ff00] mb-1">MPLAY STATUS</div>
                    <div id="disp-stat_mp3" class="font-mono text-gray-400 truncate">Waiting...</div>
                </div>
            </div>

            <!-- Global Actions -->
            <div class="grid grid-cols-2 gap-3 sortable-group mt-4" id="grid-main-actions">
                <div class="col-span-2"><button onclick="fire('btn_wol')" class="hw-btn w-full py-4 text-sm">⚡ WAKE ON LAN</button></div>
                <div><button onclick="fire('btn_bo_ma2')" class="hw-btn btn-sys w-full py-5">BO MA2</button></div>
                <div><button onclick="fire('btn_bo_reso')" class="hw-btn btn-sys w-full py-5">BO RESO</button></div>
                <div><button onclick="fire('btn_bo_wing')" class="hw-btn btn-sys w-full py-5">BO WING</button></div>
                <div><button onclick="fire('btn_bo_all')" class="hw-btn btn-sys w-full py-5">BO ALL</button></div>
            </div>
        </div>

        <!-- ================= MA2 TAB ================= -->
        <div id="tab-ma2" class="tab-pane hidden flex-col p-3 space-y-4">
            
            <!-- Encoders -->
            <div class="bg-[#111] p-3 rounded border border-[#222]">
                <div class="text-[10px] text-[#ffd700] font-bold mb-2">ENCODERS</div>
                <div class="grid grid-cols-5 gap-2 sortable-group" id="grid-ma2-enc">
                    <div class="flex flex-col space-y-2"><span class="text-center text-[9px] text-[#ffd700]">ENC 1</span>
                        <button onclick="fire('enc_1_p')" class="hw-btn py-2 text-lg">+</button>
                        <button onclick="fire('enc_1_m')" class="hw-btn py-2 text-lg">-</button></div>
                    <div class="flex flex-col space-y-2"><span class="text-center text-[9px] text-[#ffd700]">ENC 2</span>
                        <button onclick="fire('enc_2_p')" class="hw-btn py-2 text-lg">+</button>
                        <button onclick="fire('enc_2_m')" class="hw-btn py-2 text-lg">-</button></div>
                    <div class="flex flex-col space-y-2"><span class="text-center text-[9px] text-[#ffd700]">ENC 3</span>
                        <button onclick="fire('enc_3_p')" class="hw-btn py-2 text-lg">+</button>
                        <button onclick="fire('enc_3_m')" class="hw-btn py-2 text-lg">-</button></div>
                    <div class="flex flex-col space-y-2"><span class="text-center text-[9px] text-[#ffd700]">ENC 4</span>
                        <button onclick="fire('enc_4_p')" class="hw-btn py-2 text-lg">+</button>
                        <button onclick="fire('enc_4_m')" class="hw-btn py-2 text-lg">-</button></div>
                    <div class="flex flex-col space-y-2"><span class="text-center text-[9px] text-[#ffd700]">ENC 5</span>
                        <button onclick="fire('enc_5_p')" class="hw-btn py-2 text-lg">+</button>
                        <button onclick="fire('enc_5_m')" class="hw-btn py-2 text-lg">-</button></div>
                </div>
            </div>

            <!-- Programmer -->
            <div class="grid grid-cols-5 gap-2 sortable-group" id="grid-ma2-prog">
                <div><button onclick="fire('ma2_prev')" class="hw-btn w-full py-3 text-[9px] btn-ma2">Prev Fix</button></div>
                <div><button onclick="fire('ma2_next')" class="hw-btn w-full py-3 text-[9px] btn-ma2">Next Fix</button></div>
                <div><button onclick="fire('ma2_hl')" class="hw-btn w-full py-3 text-[9px]">Highlt</button></div>
                <div><button onclick="fire('ma2_thru')" class="hw-btn w-full py-3 text-[9px]">Thru</button></div>
                <div><button onclick="fire('ma2_full')" class="hw-btn w-full py-3 text-[9px]">Full</button></div>
            </div>

            <!-- Exec Faders -->
            <div class="bg-[#111] p-3 rounded border border-[#222] overflow-x-auto hide-scroll">
                <div class="text-[10px] text-[#ffd700] font-bold mb-2">EXECUTORS</div>
                <div class="flex space-x-3 sortable-group w-max" id="grid-ma2-exec">
                    <!-- Faders 1-6 -->
                    <div class="flex flex-col items-center w-12">
                        <span class="text-[10px] font-bold">EX 1</span>
                        <input type="range" class="fader-vert fad-ma2" oninput="sendFader('fad_ma2_1', this.value)">
                        <button onclick="fire('ma2_ex1')" class="hw-btn w-full py-2 btn-ma2 mt-2">GO</button>
                    </div>
                    <div class="flex flex-col items-center w-12">
                        <span class="text-[10px] font-bold">EX 2</span>
                        <input type="range" class="fader-vert fad-ma2" oninput="sendFader('fad_ma2_2', this.value)">
                        <button onclick="fire('ma2_ex2')" class="hw-btn w-full py-2 btn-ma2 mt-2">GO</button>
                    </div>
                    <div class="flex flex-col items-center w-12">
                        <span class="text-[10px] font-bold">EX 3</span>
                        <input type="range" class="fader-vert fad-ma2" oninput="sendFader('fad_ma2_3', this.value)">
                        <button onclick="fire('ma2_ex3')" class="hw-btn w-full py-2 btn-ma2 mt-2">GO</button>
                    </div>
                    <div class="flex flex-col items-center w-12">
                        <span class="text-[10px] font-bold">EX 4</span>
                        <input type="range" class="fader-vert fad-ma2" oninput="sendFader('fad_ma2_4', this.value)">
                        <button onclick="fire('ma2_ex4')" class="hw-btn w-full py-2 btn-ma2 mt-2">GO</button>
                    </div>
                    <div class="flex flex-col items-center w-12">
                        <span class="text-[10px] font-bold">EX 5</span>
                        <input type="range" class="fader-vert fad-ma2" oninput="sendFader('fad_ma2_5', this.value)">
                        <button onclick="fire('ma2_ex5')" class="hw-btn w-full py-2 btn-ma2 mt-2">GO</button>
                    </div>
                    <div class="flex flex-col items-center w-12">
                        <span class="text-[10px] font-bold">EX 6</span>
                        <input type="range" class="fader-vert fad-ma2" oninput="sendFader('fad_ma2_6', this.value)">
                        <button onclick="fire('ma2_ex6')" class="hw-btn w-full py-2 btn-ma2 mt-2">GO</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= RESO TAB ================= -->
        <div id="tab-reso" class="tab-pane hidden flex-col p-3 space-y-4">
            
            <div class="bg-[#111] p-3 rounded border border-[#222]">
                <div class="flex justify-between items-end mb-3">
                    <div class="w-1/2 pr-2">
                        <label class="text-[9px] text-[#ff00ff] font-bold block mb-1">LAYER</label>
                        <select id="sel-reso-layer" class="w-full bg-black border border-[#333] rounded p-2 text-white">
                            <option>Layer 1</option><option>Layer 2</option><option>Layer 3</option>
                        </select>
                    </div>
                    <div class="w-1/2 pl-2">
                        <label class="text-[9px] text-[#ff00ff] font-bold block mb-1">COLUMN</label>
                        <select id="sel-reso-col" class="w-full bg-black border border-[#333] rounded p-2 text-white">
                            <option>Col 1</option><option>Col 2</option><option>Col 3</option>
                        </select>
                    </div>
                </div>
                <button onclick="fire('res_trigger')" class="hw-btn btn-reso w-full py-4 text-sm">TRIGGER SELECTED</button>
            </div>

            <!-- Transitions & Dials -->
            <div class="grid grid-cols-2 gap-3 sortable-group" id="grid-reso-ctrl">
                <div class="bg-[#111] p-3 rounded border border-[#222] flex flex-col justify-center space-y-2">
                    <span class="text-[10px] text-[#ff00ff] font-bold text-center">TRANSITION</span>
                    <button onclick="fire('res_cut')" class="hw-btn w-full py-3 btn-sys">CUT</button>
                    <button onclick="fire('res_auto')" class="hw-btn w-full py-3">AUTO</button>
                </div>
                <div class="bg-[#111] p-3 rounded border border-[#222] grid grid-cols-2 gap-2">
                    <span class="col-span-2 text-[10px] text-[#ff00ff] font-bold text-center">DIALS</span>
                    <button onclick="fire('res_d1_m')" class="hw-btn py-3">-</button>
                    <button onclick="fire('res_d1_p')" class="hw-btn py-3">+</button>
                    <button onclick="fire('res_d2_m')" class="hw-btn py-3">-</button>
                    <button onclick="fire('res_d2_p')" class="hw-btn py-3">+</button>
                </div>
            </div>

            <!-- Opacity Faders -->
            <div class="bg-[#111] p-3 rounded border border-[#222] overflow-x-auto hide-scroll">
                <div class="text-[10px] text-[#ff00ff] font-bold mb-2">LAYER OPACITY</div>
                <div class="flex space-x-4 sortable-group w-max" id="grid-reso-fad">
                    <div class="flex flex-col items-center w-10">
                        <span class="text-[10px] font-bold">L1</span>
                        <input type="range" class="fader-vert fad-reso" oninput="sendFader('fad_res_1', this.value)">
                    </div>
                    <div class="flex flex-col items-center w-10">
                        <span class="text-[10px] font-bold">L2</span>
                        <input type="range" class="fader-vert fad-reso" oninput="sendFader('fad_res_2', this.value)">
                    </div>
                    <div class="flex flex-col items-center w-10">
                        <span class="text-[10px] font-bold">L3</span>
                        <input type="range" class="fader-vert fad-reso" oninput="sendFader('fad_res_3', this.value)">
                    </div>
                    <div class="flex flex-col items-center w-10">
                        <span class="text-[10px] font-bold">L4</span>
                        <input type="range" class="fader-vert fad-reso" oninput="sendFader('fad_res_4', this.value)">
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= WING TAB ================= -->
        <div id="tab-wing" class="tab-pane hidden flex-col p-3 h-full">
            <div class="bg-[#111] p-3 rounded border border-[#222] overflow-x-auto hide-scroll h-full">
                <div class="text-[10px] text-[#00ffff] font-bold mb-2">MASTER DESK</div>
                <div class="flex space-x-3 sortable-group w-max h-full" id="grid-wing-fad">
                    
                    <!-- Wing Channels 1-5 -->
                    <div class="flex flex-col items-center w-14 h-[calc(100vh-220px)] justify-between">
                        <span class="text-[10px] font-bold border-b border-[#333] w-full text-center pb-1">CH 1</span>
                        <input type="range" class="fader-vert fad-wing flex-1 !h-auto min-h-[150px]" oninput="sendFader('fad_wing_1', this.value)">
                        <div class="w-full space-y-1 mt-2">
                            <button onclick="fire('wing_m1')" class="hw-btn w-full py-2 text-[9px] text-[#ff8800] border-[#ff8800]">MUTE</button>
                            <button onclick="fire('wing_dca1')" class="hw-btn w-full py-2 text-[9px] text-[#aa00ff] border-[#aa00ff]">DCA</button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center w-14 h-[calc(100vh-220px)] justify-between">
                        <span class="text-[10px] font-bold border-b border-[#333] w-full text-center pb-1">CH 2</span>
                        <input type="range" class="fader-vert fad-wing flex-1 !h-auto min-h-[150px]" oninput="sendFader('fad_wing_2', this.value)">
                        <div class="w-full space-y-1 mt-2">
                            <button onclick="fire('wing_m2')" class="hw-btn w-full py-2 text-[9px] text-[#ff8800] border-[#ff8800]">MUTE</button>
                            <button onclick="fire('wing_dca2')" class="hw-btn w-full py-2 text-[9px] text-[#aa00ff] border-[#aa00ff]">DCA</button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center w-14 h-[calc(100vh-220px)] justify-between">
                        <span class="text-[10px] font-bold border-b border-[#333] w-full text-center pb-1">CH 3</span>
                        <input type="range" class="fader-vert fad-wing flex-1 !h-auto min-h-[150px]" oninput="sendFader('fad_wing_3', this.value)">
                        <div class="w-full space-y-1 mt-2">
                            <button onclick="fire('wing_m3')" class="hw-btn w-full py-2 text-[9px] text-[#ff8800] border-[#ff8800]">MUTE</button>
                            <button onclick="fire('wing_dca3')" class="hw-btn w-full py-2 text-[9px] text-[#aa00ff] border-[#aa00ff]">DCA</button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center w-14 h-[calc(100vh-220px)] justify-between">
                        <span class="text-[10px] font-bold border-b border-[#333] w-full text-center pb-1">CH 4</span>
                        <input type="range" class="fader-vert fad-wing flex-1 !h-auto min-h-[150px]" oninput="sendFader('fad_wing_4', this.value)">
                        <div class="w-full space-y-1 mt-2">
                            <button onclick="fire('wing_m4')" class="hw-btn w-full py-2 text-[9px] text-[#ff8800] border-[#ff8800]">MUTE</button>
                            <button onclick="fire('wing_dca4')" class="hw-btn w-full py-2 text-[9px] text-[#aa00ff] border-[#aa00ff]">DCA</button>
                        </div>
                    </div>
                    <div class="flex flex-col items-center w-14 h-[calc(1
