<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA2 Toolkit: Show Converter & GDTF</title>
    <!-- Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- JSZip for packaging outputs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Pako for .show.gz compression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1A1A1B);
            color: var(--tg-theme-text-color, #E1E1E1);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            margin: 0;
        }
        .container {
            background-color: var(--tg-theme-secondary-bg-color, #252526);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #FFC800;
            max-width: 520px;
            margin: auto;
        }
        h2 { color: #FFC800; text-align: center; margin-top: 0; font-size: 18px; }
        .tabs { display: flex; margin-bottom: 15px; border-bottom: 1px solid #444; }
        .tab { flex: 1; padding: 10px; text-align: center; background: #1A1A1B; color: #888; cursor: pointer; font-weight: bold; font-size: 12px; }
        .tab.active { background: #FFC800; color: #000; border-top-left-radius: 4px; border-top-right-radius: 4px; }
        
        .panel { display: none; }
        .panel.active { display: block; }

        label { display: block; margin-top: 10px; font-weight: bold; font-size: 12px; color: #FFC800; }
        select, input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            background: #111;
            color: #FFC800;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #FFC800;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #e6b400; }
        #status, #gdtfStatus { margin-top: 10px; text-align: center; font-size: 12px; white-space: pre-line; }
        
        .chart-container {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #444;
            background: #111;
        }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; }
        th, td { padding: 6px; border-bottom: 1px solid #222; }
        th { background: #222; color: #FFC800; position: sticky; top: 0; }
    </style>
</head>
<body>

    <div class="container">
        <h2>grandMA2 TOOLKIT</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">Version Converter</div>
            <div class="tab" onclick="switchTab(1)">GDTF Fixture</div>
        </div>

        <!-- TAB 1: SHOW & XML CONVERTER -->
        <div class="panel active" id="panel0">
            <label>Select Show (.show.gz) or XML Files</label>
            <input type="file" id="fileInput" multiple accept="*/*">
            
            <label>Target grandMA2 Version</label>
            <select id="versionSelect">
                <option value="3.9.60">v3.9.60.x</option>
                <option value="3.9.61" selected>v3.9.61.x</option>
                <option value="3.9.62">v3.9.62.x</option>
                <option value="3.9.63">v3.9.63.x</option>
            </select>
            
            <button onclick="processFiles()">CONVERT & SAVE ARCHIVE</button>
            <div id="status"></div>
        </div>

        <!-- TAB 2: GDTF TO MA2 CONVERTER -->
        <div class="panel" id="panel1">
            <label>Select .gdtf Fixture File</label>
            <input type="file" id="gdtfInput" accept="*/*">
            
            <button onclick="processGDTF()">PARSE & SAVE MA2 PROFILE</button>
            <div id="gdtfStatus"></div>
            
            <div id="fixtureInfo" style="margin-top:10px; font-size:12px; display:none;">
                <b id="fxName" style="color:#FFC800;"></b><br/>
                <span id="fxModes"></span>
            </div>

            <div class="chart-container" id="chartWrapper" style="display:none;">
                <table id="dmxTable">
                    <thead>
                        <tr>
                            <th>Offset</th>
                            <th>Attribute</th>
                            <th>MA2 Parameter</th>
                        </tr>
                    </thead>
                    <tbody id="dmxBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === index));
            document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === index));
        }

        // --- UNIVERSAL MOBILE/DESKTOP DOWNLOAD HANDLER ---
        async function saveAndDownload(zip, filename, statusDiv, successMsg) {
            try {
                const blob = await zip.generateAsync({type:"blob"});
                const file = new File([blob], filename, {type: "application/zip"});
                
                // 1. Try Native iOS/Android Web Share (Fixes Telegram WebView Block)
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: filename,
                        files: [file]
                    });
                    statusDiv.innerText = successMsg + "\n(Opened Save dialog)";
                } else {
                    // 2. Fallback to standard Anchor Download for Desktop
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { a.remove(); window.URL.revokeObjectURL(url); }, 100);
                    statusDiv.innerText = successMsg;
                }
                statusDiv.style.color = "lightgreen";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } catch (err) {
                // 3. Ultimate Fallback (Base64) if WebView strictly blocks both
                try {
                    const base64 = await zip.generateAsync({type:"base64"});
                    const a = document.createElement('a');
                    a.href = "data:application/zip;base64," + base64;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    statusDiv.innerText = successMsg + "\n(Saved via Base64 fallback)";
                    statusDiv.style.color = "lightgreen";
                } catch (fallbackErr) {
                    statusDiv.innerText = "Download blocked by device. Try running in standard Safari/Chrome.";
                    statusDiv.style.color = "red";
                }
            }
        }

        // --- TAB 1: VERSION CONVERTER LOGIC ---
        async function processFiles() {
            const fileInput = document.getElementById('fileInput');
            const versionParts = document.getElementById('versionSelect').value.split('.');
            const statusDiv = document.getElementById('status');
            
            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Error: Please select files first.";
                statusDiv.style.color = "red";
                return;
            }

            const [vMaj, vMin, vStr] = versionParts;
            statusDiv.innerText = "Processing files...";
            statusDiv.style.color = "#FFC800";

            const zip = new JSZip();
            const p_major = /(major_vers=")\d+(")/g;
            const p_minor = /(minor_vers=")\d+(")/g;
            const p_stream = /(stream_vers=")\d+(")/g;
            const p_schema = /(http:\/\/schemas\.malighting\.de\/grandma2\/xml\/)\d+\.\d+\.\d+(\/MA\.xsd)/g;

            let processedCount = 0;
            for (let i = 0; i < fileInput.files.length; i++) {
                try {
                    const file = fileInput.files[i];
                    const arrayBuffer = await file.arrayBuffer();
                    const fname = file.name.toLowerCase();

                    if (fname.endsWith('.xml')) {
                        let text = new TextDecoder('utf-8').decode(arrayBuffer);
                        text = text.replace(p_major, `$1${vMaj}$2`).replace(p_minor, `$1${vMin}$2`)
                                   .replace(p_stream, `$1${vStr}$2`).replace(p_schema, `$1${vMaj}.${vMin}.${vStr}$2`);
                        zip.file(file.name, text);
                        processedCount++;
                    } else if (fname.endsWith('.gz') || fname.endsWith('.show.gz')) {
                        const decompressed = pako.inflate(new Uint8Array(arrayBuffer));
                        let text = new TextDecoder('utf-8', { fatal: false }).decode(decompressed);
                        text = text.replace(p_major, `$1${vMaj}$2`).replace(p_minor, `$1${vMin}$2`)
                                   .replace(p_stream, `$1${vStr}$2`).replace(p_schema, `$1${vMaj}.${vMin}.${vStr}$2`);
                        zip.file(file.name, pako.deflate(new TextEncoder().encode(text)));
                        processedCount++;
                    }
                } catch (fileErr) {
                    console.error("Skipped unreadable file: ", fileErr);
                }
            }

            if (processedCount > 0) {
                const filename = `MA2_Bundle_v${vMaj}.${vMin}.${vStr}.zip`;
                await saveAndDownload(zip, filename, statusDiv, `Success! Converted ${processedCount} files.`);
            } else {
                statusDiv.innerText = "Error: Could not read valid .xml or .gz files.";
                statusDiv.style.color = "red";
            }
        }

        // --- GDTF TO MA2 ATTRIBUTE MAPPER ---
        function mapGdtfToMa2(gdtfAttr) {
            if (!gdtfAttr) return "DUMMY";
            const map = {
                "Dimmer": "DIM", "Pan": "PAN", "Tilt": "TILT",
                "ColorAdd_R": "COLORRGB1", "ColorAdd_G": "COLORRGB2", 
                "ColorAdd_B": "COLORRGB3", "ColorAdd_W": "COLORRGB4",
                "ColorAdd_C": "COLORRGB5", "ColorAdd_M": "COLORRGB6", "ColorAdd_Y": "COLORRGB7",
                "Zoom": "ZOOM", "Focus": "FOCUS", "Iris": "IRIS",
                "Gobo1": "GOBO1", "Gobo1Pos": "GOBO1_POS", "Gobo2": "GOBO2",
                "Shutter": "SHUTTER", "Strobe": "SHUTTER",
                "ColorMacro": "COLOR1", "CTO": "CTO", "CTC": "CTC"
            };
            return map[gdtfAttr] || gdtfAttr.toUpperCase().replace(/[^A-Z0-9_]/g, '');
        }

        // --- TAB 2: GDTF PARSER & XML BUILDER ---
        async function processGDTF() {
            const fileInput = document.getElementById('gdtfInput');
            const statusDiv = document.getElementById('gdtfStatus');
            
            if (fileInput.files.length === 0) {
                statusDiv.innerText = "Error: Please select a GDTF file.";
                statusDiv.style.color = "red";
                return;
            }

            statusDiv.innerText = "Building MA2 XML Profile...";
            statusDiv.style.color = "#FFC800";

            try {
                const file = fileInput.files[0];
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);

                let descFile = zipContent.file("description.xml");
                if (!descFile) throw new Error("description.xml missing inside archive.");

                const xmlText = await descFile.async("text");
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");

                const fixtureType = xmlDoc.querySelector("FixtureType");
                const fxNameVal = fixtureType ? (fixtureType.getAttribute("Name") || fixtureType.getAttribute("LongName")) : file.name.split('.')[0];
                
                const dmxModes = xmlDoc.querySelectorAll("DMXMode");
                let modeNames = [];
                let ma2DmxModesXML = "";
                let tableRows = "";

                dmxModes.forEach((mode, modeIdx) => {
                    let modeName = mode.getAttribute("Name") || `Mode ${modeIdx + 1}`;
                    modeNames.push(modeName);
                    
                    let channelsXML = "";
                    const dmxChannels = mode.querySelectorAll("DMXChannel");
                    
                    dmxChannels.forEach((ch, chIdx) => {
                        let offsetStr = ch.getAttribute("Offset") || "";
                        if (!offsetStr || offsetStr === "None") return;
                        
                        let logicalChan = ch.querySelector("LogicalChannel");
                        let gdtfAttr = logicalChan ? logicalChan.getAttribute("Attribute") : "Dummy";
                        let ma2Attr = mapGdtfToMa2(gdtfAttr);
                        
                        channelsXML += `\n          <DMXChannel index="${chIdx}" attribute="${ma2Attr}" offset="${offsetStr}" default="0" highlight="100"/>`;
                        
                        if(modeIdx === 0) {
                            tableRows += `<tr><td>${offsetStr}</td><td>${gdtfAttr}</td><td style="color:#FFC800">${ma2Attr}</td></tr>`;
                        }
                    });

                    ma2DmxModesXML += `
      <DMXMode index="${modeIdx}" name="${modeName}">
        <DMXChannels>${channelsXML}
        </DMXChannels>
      </DMXMode>`;
                });

                document.getElementById('fxName').innerText = `Fixture: ${fxNameVal}`;
                document.getElementById('fxModes').innerText = `Modes Built: ${modeNames.join(', ')}`;
                document.getElementById('fixtureInfo').style.display = "block";
                document.getElementById('dmxBody').innerHTML = tableRows;
                document.getElementById('chartWrapper').style.display = "block";

                const ma2ProfileXML = `<?xml version="1.0" encoding="utf-8"?>
<MA xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns="http://schemas.malighting.de/grandma2/xml/MA" xsi:schemaLocation="http://schemas.malighting.de/grandma2/xml/MA http://schemas.malighting.de/grandma2/xml/3.9.61/MA.xsd" major_vers="3" minor_vers="9" stream_vers="61">
  <FixtureType index="0" name="${fxNameVal}" mode="${modeNames[0]}">
    <Info>Auto-converted from GDTF</Info>
    <Modules>
      <Module index="0" name="Main" class="Headmover" beamtype="Wash" />
    </Modules>
    <Instances>
      <Instance index="0" module_index="0" />
    </Instances>
    <DMXModes>${ma2DmxModesXML}
    </DMXModes>
  </FixtureType>
</MA>`;

                const outZip = new JSZip();
                outZip.file(`${fxNameVal}_MA2.xml`, ma2ProfileXML);
                
                await saveAndDownload(outZip, `${fxNameVal}_MA2.zip`, statusDiv, `Success! Converted ${modeNames.length} modes.`);

            } catch (err) {
                statusDiv.innerText = "GDTF Parse Error: " + err.message;
                statusDiv.style.color = "red";
            }
        }
    </script>
</body>
</html>
